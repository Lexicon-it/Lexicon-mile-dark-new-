                - generic [ref=f4e81]: Global Standards
          - generic [ref=f4e82]: “A genuine smile with glitter in the eyes of the student is the only true return on investment in the noble pursuit of education.”
        - article [ref=f4e83]:
          - generic [ref=f4e84]:
            - heading "Dear Students, Parents, & Well-Wishers," [level=2] [ref=f4e85]
            - generic [ref=f4e86]:
              - paragraph [ref=f4e87]: The Lexicon Management Institute of Leadership & Excellence carries a legacy as old as 2006, when the first Lexicon International School was established in Wagholi. Lexicon Management Institute of Leadership & Excellence was formed in the year 2009 and we have successfully completed a decade and more of excellence in higher management education.
              - paragraph [ref=f4e88]: Lexicon Management Institute of Leadership & Excellence has achieved a great feat within a short span of time. Embarking on the path of successfully running a business school situated in Pune has not been a cake walk. We have been strong in our resolution to provide an ever evolving and expanding high quality education inculcating each domain of knowledge and catering only the best to the inquisitive and intellectual minds of India.
              - paragraph [ref=f4e90]: “The USP of Lexicon MILE lies in its contemporary pedagogies which, in coalition with positive outlook, enviable global standards and great emphasis on moral values, makes us a league apart from our contemporaries.”
              - paragraph [ref=f4e91]: We take great pride in imparting traditional and social responsibilities, which are invoked in our scholars via frequent and timely celebration of all festivals in accordance with the spirit of national secularism. We are highly conscious of the great challenges which lie ahead on this path of nation building which requires great dedication and humble service from the entire Lexicon MILE family. Still, there is a lot which is left to be done.
              - paragraph [ref=f4e92]: There is a gap in the need of industry for skilled, efficient, adaptable and honest human resources as only 70% of students studying in business schools are employable. To bridge this gap, the most talented team at Lexicon MILE with the help of extremely enlightened people from academia have created the syllabus and processes which are in sync with today’s industry needs. To explore, innovate and execute is a habit of Lexiconites.
              - paragraph [ref=f4e93]: "Last but not the least are these famous lines from Robert Frost: “But I have promises to keep & miles to go before I sleep.”"
