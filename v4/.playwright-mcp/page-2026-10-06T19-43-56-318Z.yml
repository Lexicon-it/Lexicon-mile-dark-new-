        - paragraph [ref=f2e390]: An ideal gateway for a conducive and peaceful environment, designed for higher management education.
      - paragraph [ref=f2e392]: Lexicon Management Institute of Leadership and Excellence (Lexicon MILE) stands tall on the famous main highway of Nagar Road, Wagholi. Away from the hustle-bustle of the city of Pune, surrounded by swaying palm trees, the campus of Lexicon Management Institute of Leadership and Excellence is an ideal gateway for a conducive and peaceful environment, for a two-year full-time program, in higher management education. At our illustrious Lexicon Group of Institutions, we are currently catering to more than 16,000 students who are about to shape their careers and excel at their feat, strengthening our position among management colleges in Pune.
