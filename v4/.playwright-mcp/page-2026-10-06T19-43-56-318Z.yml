        - generic [ref=f2e62]:
          - paragraph [ref=f2e63]: ABOUT US · 20+ YEARS EDUCATION LEGACY
          - heading "About Lexicon MILE." [level=1] [ref=f2e64]
        - paragraph [ref=f2e65]: Lexicon MILE and Lexicon Group’s 20+ year education legacy makes us one of the top management colleges in Pune for vision, leadership, and excellence.
    - generic [ref=f2e68]:
      - generic [ref=f2e69]:
        - heading "Vision" [level=3] [ref=f2e74]
        - paragraph [ref=f2e75]: To be an educational institution of choice for all stakeholders which promotes human well-being through continuous learning.
      - generic [ref=f2e76]:
        - heading "Mission" [level=3] [ref=f2e82]
        - paragraph [ref=f2e83]: To foster a dynamic environment of academic excellence equipped to nurture versatile, ethical, and industry-ready global leaders.
      - generic [ref=f2e84]:
        - heading "Core Values" [level=3] [ref=f2e88]
        - paragraph [ref=f2e89]: Integrity, continuous innovation, empathy, and an unwavering commitment to quality education and human flourishing.
    - generic [ref=f2e92]:
      - generic [ref=f2e93]:
        - generic [ref=f2e94]:
          - paragraph [ref=f2e95]: 01 / OUR FOUNDATION & GROUP REACH
          - heading "About the Lexicon Family." [level=3] [ref=f2e96]
          - paragraph [ref=f2e97]: Founded in 2006 in Pune, The Lexicon Group has evolved into a premier educational and business leader, empowering individuals at every stage of life. From schools and preschools to institutes specializing in management, hotel management, media, and animation, as well as a dedicated therapy center for specially-abled students, we are committed to delivering quality education and transformative services.
          - paragraph [ref=f2e98]: Beyond the educational sphere, The Lexicon Group has diversified into fields such as research, media, law, and wellness. Guided by a commitment to excellence and entrepreneurial values, we continue to grow, with an unwavering focus on quality and integrity at our core.
        - generic [ref=f2e99]:
          - paragraph [ref=f2e100]: TRANSFORMING BUSINESS EDUCATION
          - heading "About Lexicon MILE." [level=3] [ref=f2e101]
          - paragraph [ref=f2e102]: Lexicon Management Institute of Leadership & Excellence (Lexicon MILE), Pune, founded in 2009 as part of the Lexicon Group, has been transforming business education for the past 15 years and is recognized among the premier management colleges in Pune.
          - paragraph [ref=f2e103]: Our two-year, full-time Post Graduate Diploma in Management (PGDM) program goes beyond traditional learning, with a bold emphasis on entrepreneurship and start-up culture. At Lexicon MILE, we shape versatile leaders, ready to thrive in managerial roles at top organizations, qualified with the skills, confidence, and entrepreneurial mindset essential for success in specialized career paths.
      - generic [ref=f2e105]:
        - img "Lexicon MILE Campus and Students" [ref=f2e106]
        - generic [ref=f2e107]:
          - generic [ref=f2e108]: PUNE, MAHARASHTRA · EST. 2009
          - strong [ref=f2e109]: 15+ Years of Business Education Excellence
