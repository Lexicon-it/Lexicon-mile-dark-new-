      - generic [ref=e805]:
        - generic [ref=e806]: COMMON QUERIES
        - heading "Frequently Asked Questions." [level=2] [ref=e807]
        - paragraph [ref=e808]: "Everything you need to know about the B.Sc in Hospitality Studies at Lexicon HMCT & MILE:"
      - generic [ref=e809]:
        - generic [ref=e810]:
          - button "What is the core difference between a B.Sc in Hospitality Studies and a Diploma course?" [expanded] [ref=e811] [cursor=pointer]
          - paragraph [ref=e817]: The B.Sc in Hospitality Studies is a comprehensive 3-year undergraduate degree program recognized by the UGC and AIU, affiliated with YCMOU. Unlike short diploma certifications, this degree qualifies students for postgraduate study (MBA/PGDM/M.Sc) worldwide, government service exams (UPSC/MPSC), and fast-track managerial training programs (MT) across leading international hotel chains.
        - generic [ref=e818]:
          - button "Is the B.Sc in Hospitality Studies degree recognized by UGC and AIU?" [ref=e819] [cursor=pointer]
          - paragraph [ref=e824]: Yes. The degree is awarded by Yashwantrao Chavan Maharashtra Open University (YCMOU), a state university established by an Act of the Maharashtra State Legislature. It is recognized by the University Grants Commission (UGC) and the Association of Indian Universities (AIU), and holds an ‘A’ Grade accreditation by NAAC. The degree is at par with degrees granted by all Indian universities.
        - generic [ref=e825]:
          - button "How does the dual internship program work across 5-star hotel brands?" [ref=e826] [cursor=pointer]
          - paragraph [ref=e831]: Lexicon HMCT incorporates dual industrial training internships into the 3-year curriculum. Students undergo practical field immersion at leading luxury hotel partners, such as Marriott, The Ritz Carlton, Conrad, Taj, and The Oberoi Group, gaining real-time operational expertise in food production, service, front office, and housekeeping, culminating in a 300-mark capstone internship in Semester 6.
        - generic [ref=e832]:
          - button "Do students receive foreign language certifications during the course?" [ref=e833] [cursor=pointer]
          - paragraph [ref=e838]: Yes. Given the global nature of luxury hospitality, students receive professional certifications in Spoken French and Executive Spoken English as part of their academic curriculum. This language capability gives our graduates a decisive edge during international hotel recruitments and cruise liner interviews.
        - generic [ref=e839]:
          - button "What career roles and opportunities are available after graduation?" [ref=e840] [cursor=pointer]
          - paragraph [ref=e845]: Graduates step directly into corporate Management Trainee (MT) and Operational Trainee (OT) roles across 5-star hotel chains, fine dining restaurant groups, luxury cruise lines, international airlines (cabin crew and ground operations), event management companies, facility management MNCs, and cloud kitchen enterprises.
        - generic [ref=e846]:
          - button "How does the Part-A and Part-B fee payment structure work?" [ref=e847] [cursor=pointer]
          - paragraph [ref=e852]: "The total course fee (approx. ₹6,50,000 for 3 years) is transparently bifurcated: Part-A (₹5,20,226 total; ₹1,73,408 per year) covers Lexicon HMCT department skills modules, lab supplies, professional certifications, and grooming; Part-B (₹1,29,774 total; approx. ₹43,258 per year) is paid directly by the student to YCMOU on the university’s official online portal."
