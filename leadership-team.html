<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070C">
  <title>Leadership Team | Lexicon MILE</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="preload" href="assets/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    /* Scope styles for WP content to adapt to dark theme */
    .wp-content {
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      font-size: 1.1rem;
    }
    .wp-content h1, .wp-content h2, .wp-content h3, .wp-content h4, .wp-content h5, .wp-content h6 {
      color: #fff;
      margin-top: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .wp-content a {
      color: #8cb4f5;
      text-decoration: underline;
    }
    .wp-content p {
      margin-bottom: 1.5rem;
    }
    .wp-content ul, .wp-content ol {
      margin-bottom: 1.5rem;
      padding-left: 2rem;
    }
    .wp-content li {
      margin-bottom: 0.5rem;
    }
    .wp-content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }
    .wp-content th, .wp-content td {
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem;
    }
    .wp-content th {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="header"></div>
  <main id="main">
    <section class="section" style="padding-top: 150px; min-height: 80vh;">
      <div class="container">
         <div class="section-heading reveal">
           <div>
             <p class="eyebrow">LEXICON MILE</p>
             <h2>Leadership Team<span class="period">.</span></h2>
           </div>
         </div>
         <div class="wp-content">
            
         </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="js/components.js"></script>
</body>
</html>
